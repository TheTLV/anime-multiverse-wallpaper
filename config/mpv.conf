# Optimized mpv configuration for Anime Multiverse Live Wallpaper
vo=gpu
hwdec=auto
no-border
loop-file=inf
no-audio
force-window=immediate
keepaspect=yes
keepaspect-window=no
no-auto-window-resize
panscan=1.0
video-unscaled=no
osc=no
osd-bar=no
input-default-bindings=no
input-vo-keyboard=no
cursor-autohide=no
no-terminal
